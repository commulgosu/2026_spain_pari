<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e9">
  <meta name="description" content="2026년 11월 바르셀로나와 파리 가족 여행 일정">
  <title>Barcelona · Paris | 가족 여행 일정</title>
  <style>
    :root{--paper:#f5f1e9;--ink:#182a2a;--muted:#6e7972;--line:#d9d8cd;--orange:#d45c3e;--green:#1e6256;--card:#fffdf8;--gold:#e7bd72}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;line-height:1.55}
    a{color:inherit}.wrap{max-width:1120px;margin:auto;padding:0 24px}.hero{padding:46px 0 26px;background:linear-gradient(135deg,#e8e5d8,#f5f1e9 65%);border-bottom:1px solid var(--line)}
    .eyebrow{color:var(--green);font-size:.76rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-family:Georgia,"Noto Serif KR",serif;font-weight:500;font-size:clamp(2.5rem,7vw,5.2rem);line-height:.98;letter-spacing:-.045em;margin:14px 0}.hero h1 span{color:var(--orange)}
    .hero p{color:var(--muted);max-width:620px;margin:18px 0}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#ffffff80;font-size:.85rem}
    .sticky{position:sticky;top:0;z-index:5;background:#f5f1e9ed;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.controls{display:flex;gap:8px;padding:12px 0;overflow:auto}.control{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;font:inherit;font-size:.9rem;white-space:nowrap;cursor:pointer}.control.active{background:var(--ink);color:white;border-color:var(--ink)}
    main{padding:30px 0 70px}.section{margin:0 0 45px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:15px}.section-head h2{font:500 clamp(1.7rem,4vw,2.6rem)/1.1 Georgia,"Noto Serif KR",serif;margin:0}.section-head p{color:var(--muted);margin:6px 0 0;font-size:.9rem}
    .day-nav{display:flex;gap:8px;overflow:auto;margin:0 auto;padding-bottom:10px}.day-link{display:flex;align-items:center;gap:7px;flex:none;text-decoration:none;border:1px solid var(--line);background:#ffffff80;border-radius:10px;padding:8px 12px;font-size:.85rem;white-space:nowrap}.day-link:hover{border-color:var(--green)}.day-link .weekday{font-size:.74rem;font-weight:800;color:var(--muted);background:#eef0eb;padding:2px 6px;border-radius:999px}.day-link.saturday .weekday{color:#286c9a;background:#e4f0f6}.day-link.sunday .weekday{color:#bd493f;background:#f8e9e5}
    .day{margin:0 0 16px;padding:18px 18px 8px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px #182a2a08;scroll-margin-top:120px}.day-title{display:flex;align-items:baseline;gap:10px;padding:0 0 10px;border-bottom:1px solid var(--line)}.day-title strong{font:500 1.55rem Georgia,"Noto Serif KR",serif}.day-title span{color:var(--muted);font-size:.9rem}
    .timeline{display:grid;grid-template-columns:106px 1fr;gap:0 16px}.time{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--green);font-weight:750;padding:17px 0 0}.event{position:relative;border-left:1px solid var(--line);padding:14px 0 16px 19px;scroll-margin-top:140px}.event.current{background:#ffffff80;border-radius:0 12px 12px 0;box-shadow:0 4px 16px #182a2a12}.event:before{content:"";position:absolute;left:-5px;top:22px;width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px var(--paper)}.event.rain:before{background:#5585a3}.event h3{font-size:1rem;line-height:1.4;margin:0 0 7px}.event h3 a{color:inherit;text-decoration:none}.event h3 a:hover,.event h3 a:focus-visible{color:var(--green);text-decoration:underline;text-underline-offset:3px}.map-arrow{display:inline-block;color:var(--green);font-size:.8em;margin-left:3px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.badge{font-size:.73rem;color:var(--green);background:#e7eee8;padding:3px 8px;border-radius:999px}.rain .badge{color:#3b647a;background:#e4edf2}.tip{margin:0;color:var(--muted);font-size:.88rem}.transport{font-size:.83rem;color:var(--ink);margin:7px 0 0}.empty{padding:24px;background:var(--card);border-radius:14px;color:var(--muted)}
    .rain-accordion{grid-column:1/-1;margin:12px 0 4px;border:1px solid #d5e1e6;background:#f4f8f9;border-radius:12px;overflow:hidden}.rain-accordion>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:12px;color:#3b647a;font-weight:750}.rain-accordion>summary::-webkit-details-marker{display:none}.rain-accordion>summary:focus-visible{outline:3px solid #5585a3;outline-offset:-3px;border-radius:12px}.rain-count{margin-left:auto;color:var(--muted);font-size:.78rem;font-weight:600}.rain-action{font-size:.82rem;white-space:nowrap}.rain-accordion[open] .rain-expand{display:none}.rain-accordion:not([open]) .rain-collapse{display:none}.rain-timeline{padding:4px 14px 10px;border-top:1px solid #d5e1e6}.rain-timeline .time{color:#3b647a}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px}.card h3{font-size:1rem;margin:0 0 6px}.card p{margin:5px 0;color:var(--muted);font-size:.88rem}.card b{color:var(--ink)}.footer{border-top:1px solid var(--line);padding:20px 0 34px;color:var(--muted);font-size:.8rem}
    .coupon-card{grid-column:1/-1;padding:0;overflow:hidden}.coupon-item summary{list-style:none;cursor:pointer;padding:17px;font-size:1rem;font-weight:750;display:flex;align-items:center;justify-content:space-between;gap:12px}.coupon-item summary::-webkit-details-marker{display:none}.coupon-item summary:after{content:"＋";color:var(--green);font-size:1.15rem}.coupon-item[open] summary:after{content:"−"}.coupon-item summary:focus-visible{outline:3px solid var(--green);outline-offset:-3px;border-radius:14px}.coupon-content{padding:0 17px 17px;border-top:1px solid var(--line)}.coupon-content p{margin:12px 0;color:var(--muted);font-size:.88rem}.coupon-image{display:block;width:min(100%,560px);height:auto;margin:16px auto;border-radius:10px}.coupon-link{display:inline-flex;margin-top:8px;padding:10px 14px;border-radius:999px;background:var(--green);color:white;text-decoration:none;font-size:.9rem;font-weight:700}.coupon-link:hover{background:var(--ink)}.coupon-code{display:inline-block;margin-top:4px;padding:10px 16px;border-radius:10px;background:#e7eee8;color:var(--green);font-size:1.15rem;letter-spacing:.08em;font-weight:800}
    .notice-compose{grid-column:1/-1}.notice-form{display:grid;gap:12px;max-width:720px}.notice-form label{display:grid;gap:5px;font-size:.88rem;font-weight:700}.notice-form input,.notice-form textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font:inherit;background:white;color:var(--ink)}.notice-form textarea{min-height:130px;resize:vertical}.notice-form button{justify-self:start;border:0;border-radius:999px;padding:11px 17px;background:var(--green);color:white;font:inherit;font-weight:750;cursor:pointer}.notice-form button:disabled{opacity:.55;cursor:wait}.notice-honeypot{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}.notice-status{min-height:1.5em;color:var(--green);font-size:.88rem}.notice-privacy{margin:0;color:var(--muted);font-size:.82rem}.notice-list{grid-column:1/-1;display:grid;gap:12px}.notice-item h3{margin:0 0 6px}.notice-item p{white-space:pre-wrap;overflow-wrap:anywhere}.notice-meta{margin-bottom:7px;color:var(--muted);font-size:.78rem}.guestbook-admin{grid-column:1/-1}.guestbook-admin>summary{cursor:pointer;font-weight:750}.guestbook-delete{margin-top:8px;border:1px solid #dfb9b5;border-radius:999px;padding:6px 12px;background:#fff7f6;color:#a23f36;font:inherit;font-size:.82rem;cursor:pointer}.guestbook-delete:hover{background:#f8e9e5}
    .home-notices{margin:0 0 28px;padding:0;overflow:hidden}.home-notices>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px}.home-notices>summary::-webkit-details-marker{display:none}.home-notices>summary:focus-visible{outline:3px solid var(--green);outline-offset:-3px}.home-notice-heading{display:grid;gap:2px}.home-notice-heading strong{font-size:1rem}.home-notice-heading small{color:var(--muted);font-size:.78rem}.home-notice-action{color:var(--green);font-size:.84rem;font-weight:750;white-space:nowrap}.home-notices[open] .home-notice-expand,.home-notices:not([open]) .home-notice-collapse{display:none}.home-notice-list{display:grid;gap:0;padding:0 18px 8px}.home-notice-item{padding:12px 0;border-top:1px solid var(--line)}.home-notice-meta{color:var(--muted);font-size:.76rem;margin-bottom:4px}.home-notice-message{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem}.home-notice-empty{padding:12px 0;border-top:1px solid var(--line);margin:0;color:var(--muted);font-size:.88rem}
    .delete-password-dialog{width:min(420px,calc(100% - 32px));border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--card);color:var(--ink);box-shadow:0 18px 50px #182a2a30}.delete-password-dialog::backdrop{background:#182a2a70}.delete-password-dialog h2{font:500 1.35rem Georgia,"Noto Serif KR",serif;margin:0 0 8px}.delete-password-dialog p{margin:0 0 14px;color:var(--muted);font-size:.88rem}.delete-password-dialog form{display:grid;gap:10px}.delete-password-dialog label{display:grid;gap:5px;font-weight:700;font-size:.88rem}.delete-password-dialog input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font:inherit}.delete-password-dialog button{border:0;border-radius:999px;padding:10px 14px;background:var(--green);color:white;font:inherit;font-weight:700;cursor:pointer}.delete-password-dialog button[type=button]{background:#e9e9e2;color:var(--ink)}.delete-password-actions{display:flex;gap:8px;justify-content:flex-end}
    @media(max-width:640px){.wrap{padding:0 16px}.hero{padding-top:34px}.timeline{grid-template-columns:76px 1fr;gap:0 9px}.time{font-size:.75rem}.event{padding-left:14px}.day{padding:14px 12px 6px;margin-bottom:12px}.rain-accordion>summary{gap:8px;padding:10px 12px}.rain-count{display:none}.notice-form button{width:100%}.grid{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap">
    <div class="eyebrow">Family trip · 2026</div><h1>Barcelona <span>·</span><br>Paris</h1>
  </div></header>
  <div class="sticky"><nav class="wrap controls" aria-label="일정 보기">
    <button class="control active" data-mode="all">전체 일정</button><button class="control" data-mode="plan">기본 일정</button><button class="control" data-mode="rain">☔ 우천 대안</button><button class="control" data-mode="transport">🚇 이동 가이드</button><button class="control" data-mode="solo">🌿 11/22 개별 코스</button><button class="control" data-mode="notices">✍️ 공지 &amp; 메모</button><button class="control" data-mode="coupons">🎟️ Tip&amp;쿠폰</button>
  </nav><nav id="dayNav" class="wrap day-nav" aria-label="날짜 이동"></nav></div>
  <main class="wrap"><section id="schedule" class="section"><details id="homeNotices" class="home-notices card" open><summary><span class="home-notice-heading"><strong>공지 &amp; 메모</strong><small>최신 글 최대 5개</small></span><span class="home-notice-action home-notice-collapse">접기 −</span><span class="home-notice-action home-notice-expand">펼치기 ＋</span></summary><div id="homeNoticeList" class="home-notice-list" aria-live="polite"><p class="home-notice-empty">공지와 메모를 불러오는 중…</p></div></details><div class="section-head"><div><h2>여행 일정</h2><p>상단 날짜 버튼을 눌러 해당 일정을 바로 확인하세요.</p></div></div><div id="days"></div></section>
    <section id="extras" class="section" hidden><div class="section-head"><div><h2 id="extraTitle"></h2><p id="extraIntro"></p></div></div><div id="extraCards" class="grid"></div></section>
  </main>
  <footer class="footer"><div class="wrap">개인 여행 일정 · 방문 시간, 교통편, 요금은 현지 사정에 따라 달라질 수 있습니다.</div></footer>
  <dialog id="deletePasswordDialog" class="delete-password-dialog"><h2>공지·메모 삭제</h2><p>등록할 때 설정한 삭제 비밀번호를 입력하세요.</p><form id="deletePasswordForm"><label>삭제 비밀번호<input name="password" type="password" autocomplete="current-password" required></label><div class="delete-password-actions"><button type="button" id="cancelDeletePassword">취소</button><button type="submit">삭제</button></div></form></dialog>
  <script>
    const $=s=>document.querySelector(s);let data;
    const clean=s=>s.replace(/^\[(?:★[^\]]*|☔[^\]]*|가족 공통|아내 추천|시간확정[^\]]*|일정 분리[^\]]*)\]\s*/,'').trim();
    const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const mapUrl=title=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(clean(title));
    async function refreshHomeNotices(){
      const list=$('#homeNoticeList');if(!list)return;
      try{
        const config=await fetch('./site-config.json?v=3',{cache:'no-store'}).then(r=>r.json()),projectUrl=String(config.supabaseUrl||'').replace(/\/$/,''),publishableKey=String(config.supabasePublishableKey||'');
        if(!projectUrl||!publishableKey)throw Error('설정');
        const r=await fetch(`${projectUrl}/rest/v1/guestbook_entries?select=author,message,created_at&order=created_at.desc&limit=5`,{headers:{apikey:publishableKey,Authorization:`Bearer ${publishableKey}`},cache:'no-store'});
        if(!r.ok)throw Error('조회');
        const entries=await r.json();
        list.innerHTML=entries.length?entries.map(entry=>`<article class="home-notice-item"><div class="home-notice-meta">${escapeHtml(entry.author||'익명')} · ${escapeHtml(new Date(entry.created_at).toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'}))}</div><p class="home-notice-message">${escapeHtml(entry.message)}</p></article>`).join(''):'<p class="home-notice-empty">아직 등록된 공지나 메모가 없습니다.</p>';
      }catch{list.innerHTML='<p class="home-notice-empty">공지와 메모를 불러오지 못했습니다.</p>'}
    }
    function renderTimeline(items,extraClass=''){return `<div class="timeline ${extraClass}">${items.map(i=>`<div class="time">${escapeHtml(i.time.replace(/\s*\(우천시\)/g,''))}</div><div class="event ${i.rain?'rain':''}"><h3><a href="${mapUrl(i.title)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(clean(i.title))} · Google 지도에서 열기">${escapeHtml(clean(i.title))}<span class="map-arrow" aria-hidden="true">↗</span></a></h3><div class="badges">${i.rain?'<span class="badge">☔ 우천 대안</span>':''}${i.duration?`<span class="badge">${escapeHtml(i.duration)}</span>`:''}</div>${i.tip?`<p class="tip">${escapeHtml(i.tip)}</p>`:''}${i.move?`<p class="transport">↗ ${escapeHtml(i.move)}</p>`:''}</div>`).join('')}</div>`}
    function render(mode='all'){
      $('#dayNav').innerHTML=data.days.map(d=>`<a class="day-link ${d.weekday==='토'?'saturday':d.weekday==='일'?'sunday':''}" href="#d${d.date}">11/${d.date}<span class="weekday">${d.weekday}</span></a>`).join('');
      $('#days').innerHTML=data.days.map(d=>{const regular=mode==='rain'?[]:d.items.filter(i=>!i.rain),rain=mode==='plan'?[]:d.items.filter(i=>i.rain);const content=(regular.length?renderTimeline(regular):'')+(rain.length?`<details class="rain-accordion"><summary><span>☔ 우천 대안 일정</span><span class="rain-count">${rain.length}개</span><span class="rain-action rain-expand">펼치기 ＋</span><span class="rain-action rain-collapse">접기 −</span></summary>${renderTimeline(rain,'rain-timeline')}</details>`:'');return `<article class="day" id="d${d.date}"><div class="day-title"><strong>11월 ${d.date}일</strong><span>${d.weekday}요일</span></div>${content||'<p class="empty">이 날짜에는 표시할 일정이 없습니다.</p>'}</article>`}).join('');
    }
    function focusCurrentSchedule(){
      const now=new Date(),dayNumber=now.getDate(),minute=now.getHours()*60+now.getMinutes();
      if(now.getFullYear()!==2026||now.getMonth()!==10||dayNumber<21||dayNumber>29||(dayNumber===21&&minute<380)||(dayNumber===29&&minute>1191))return;
      const day=data.days.find(d=>Number(d.date)===dayNumber),article=day&&document.querySelector(`#d${day.date}`);if(!article)return;
      const times=[...article.querySelectorAll('.timeline:not(.rain-timeline) .time')],items=times.map(el=>{const m=el.textContent.match(/(\d{1,2}):(\d{2})(?:\s*~\s*(\d{1,2}):(\d{2}))?/);return m?{element:el,start:Number(m[1])*60+Number(m[2]),end:m[3]?Number(m[3])*60+Number(m[4]):null}:null;}).filter(Boolean);if(!items.length)return;
      let index=items.findIndex((item,i)=>{const end=item.end??items[i+1]?.start??item.start+60;return minute>=item.start&&minute<end;});
      if(index<0)index=items.findIndex(item=>item.start>minute);if(index<0)index=items.length-1;
      const event=items[index].element.nextElementSibling;if(!event)return;event.classList.add('current');window.scrollTo(0,Math.max(0,event.getBoundingClientRect().top+window.scrollY-140));
    }
    async function showNotices(){
      const extra=$('#extras');$('#schedule').hidden=true;extra.hidden=false;$('#dayNav').hidden=true;
      $('#extraTitle').textContent='공지 & 메모';$('#extraIntro').textContent='여행 공지와 메모를 자유롭게 남겨 주세요.';
      const cards=$('#extraCards');cards.innerHTML=`<article class="card notice-compose"><form class="notice-form" id="noticeForm"><label>닉네임 (선택)<input name="author" maxlength="30" placeholder="익명으로 남길 수도 있어요"></label><label>메시지<textarea name="body" maxlength="1500" required placeholder="공지나 메모를 남겨 주세요."></textarea></label><label>삭제 비밀번호<input name="deletePassword" type="password" minlength="6" maxlength="72" autocomplete="new-password" required placeholder="이 글을 삭제할 때 사용할 비밀번호"></label><label class="notice-honeypot" aria-hidden="true">웹사이트<input name="website" tabindex="-1" autocomplete="off"></label><p class="notice-privacy">삭제 비밀번호는 글마다 설정하며, 잊어버리면 관리자만 삭제할 수 있습니다. 6자 이상으로 설정해 주세요. 글은 모든 방문자에게 공개되니 개인정보는 적지 마세요.</p><button type="submit" disabled>연결 확인 중…</button><p class="notice-status" id="guestbookStatus" role="status" aria-live="polite"></p></form></article><details class="card guestbook-admin"><summary>관리자 로그인 · 글 삭제</summary><form class="notice-form" id="guestbookAdminForm"><label>이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><div><button type="submit">관리자 로그인</button> <button type="button" id="guestbookAdminLogout" hidden>로그아웃</button></div><p class="notice-status" id="guestbookAdminStatus" role="status" aria-live="polite"></p></form></details><div class="notice-list" id="noticeList"><p class="empty">공지와 메모를 불러오는 중…</p></div>`;
      const form=$('#noticeForm'),submit=form.querySelector('button[type="submit"]'),status=$('#guestbookStatus'),list=$('#noticeList');
      const adminForm=$('#guestbookAdminForm'),adminStatus=$('#guestbookAdminStatus'),adminLogin=adminForm.querySelector('button[type="submit"]'),adminLogout=$('#guestbookAdminLogout'),deleteDialog=$('#deletePasswordDialog'),deleteForm=$('#deletePasswordForm');let pendingDeleteId='';
      let projectUrl='',publishableKey='',adminToken='';const say=t=>status.textContent=t;const sayAdmin=t=>adminStatus.textContent=t;
      const draw=entries=>{list.innerHTML=entries.length?entries.map(entry=>`<article class="card notice-item"><div class="notice-meta">${escapeHtml(entry.author||'익명')} · ${escapeHtml(new Date(entry.created_at).toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'}))}</div><p>${escapeHtml(entry.message)}</p><button class="guestbook-delete" type="button" data-entry-id="${escapeHtml(entry.id)}" data-delete-mode="password">비밀번호로 삭제</button>${adminToken?` <button class="guestbook-delete" type="button" data-entry-id="${escapeHtml(entry.id)}" data-delete-mode="admin">관리자 삭제</button>`:''}</article>`).join(''):'<p class="empty">아직 등록된 공지나 메모가 없습니다.</p>'};
      try{
        const config=await fetch('./site-config.json?v=3',{cache:'no-store'}).then(r=>r.json());projectUrl=String(config.supabaseUrl||'').replace(/\/$/,'');publishableKey=String(config.supabasePublishableKey||'');if(!projectUrl||!publishableKey)throw Error('setup');
        const publicHeaders={apikey:publishableKey,Authorization:`Bearer ${publishableKey}`};
        const loadEntries=async()=>{const r=await fetch(`${projectUrl}/rest/v1/guestbook_entries?select=id,author,message,created_at&order=created_at.desc&limit=100`,{headers:publicHeaders,cache:'no-store'});if(!r.ok)throw Error('공지와 메모를 불러오지 못했습니다.');draw(await r.json())};
        await loadEntries();submit.disabled=false;submit.textContent='메모 등록';
        form.addEventListener('submit',async e=>{e.preventDefault();const fields=Object.fromEntries(new FormData(form));if(fields.website){form.reset();say('등록했습니다.');return}const entry={p_author:String(fields.author||'').trim().slice(0,30)||'익명',p_message:String(fields.body||'').trim(),p_password:String(fields.deletePassword||'')};submit.disabled=true;submit.textContent='등록 중…';say('');try{const r=await fetch(`${projectUrl}/rest/v1/rpc/create_guestbook_entry`,{method:'POST',headers:{...publicHeaders,'Content-Type':'application/json'},body:JSON.stringify(entry)});if(!r.ok){const detail=await r.json().catch(()=>({}));throw Error(detail.message||'저장하지 못했습니다. 잠시 후 다시 시도해 주세요.')}form.reset();say('등록했습니다.');await loadEntries()}catch(error){say(error.message||'등록 중 오류가 발생했습니다.')}finally{submit.disabled=false;submit.textContent='메모 등록'}});
        adminForm.addEventListener('submit',async e=>{e.preventDefault();adminLogin.disabled=true;sayAdmin('로그인 확인 중…');const fields=Object.fromEntries(new FormData(adminForm));try{const authResponse=await fetch(`${projectUrl}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:publishableKey,'Content-Type':'application/json'},body:JSON.stringify({email:fields.email,password:fields.password})});const auth=await authResponse.json();if(!authResponse.ok||!auth.access_token)throw Error(auth.msg||auth.message||'로그인에 실패했습니다.');const accessHeaders={apikey:publishableKey,Authorization:`Bearer ${auth.access_token}`};const membershipResponse=await fetch(`${projectUrl}/rest/v1/guestbook_admins?select=user_id&limit=1`,{headers:accessHeaders,cache:'no-store'});if(!membershipResponse.ok)throw Error('관리자 권한 설정을 확인하지 못했습니다.');const memberships=await membershipResponse.json();if(!memberships.length)throw Error('이 계정에는 방명록 삭제 권한이 없습니다.');adminToken=auth.access_token;adminLogin.hidden=true;adminLogout.hidden=false;adminForm.querySelector('[name="password"]').value='';sayAdmin('관리자 로그인됨 · 글 옆 삭제 버튼을 사용할 수 있습니다.');await loadEntries()}catch(error){sayAdmin(error.message||'로그인에 실패했습니다.')}finally{adminLogin.disabled=false}});
        adminLogout.addEventListener('click',async()=>{const token=adminToken;adminToken='';adminLogout.hidden=true;adminLogin.hidden=false;adminForm.reset();draw(await (await fetch(`${projectUrl}/rest/v1/guestbook_entries?select=id,author,message,created_at&order=created_at.desc&limit=100`,{headers:publicHeaders,cache:'no-store'})).json());sayAdmin('로그아웃했습니다.');fetch(`${projectUrl}/auth/v1/logout`,{method:'POST',headers:{apikey:publishableKey,Authorization:`Bearer ${token}`}}).catch(()=>{})});
        list.addEventListener('click',async e=>{const button=e.target.closest('.guestbook-delete');if(!button)return;const isAdmin=button.dataset.deleteMode==='admin';if(isAdmin&&!adminToken)return;if(!isAdmin){pendingDeleteId=button.dataset.entryId;deleteDialog.showModal();deleteForm.elements.password.focus();return}if(!window.confirm('이 공지·메모를 관리자 권한으로 삭제할까요?'))return;button.disabled=true;try{const r=await fetch(`${projectUrl}/rest/v1/guestbook_entries?id=eq.${encodeURIComponent(button.dataset.entryId)}`,{method:'DELETE',headers:{apikey:publishableKey,Authorization:`Bearer ${adminToken}`,Prefer:'return=minimal'}});if(!r.ok)throw Error('삭제하지 못했습니다.');sayAdmin('관리자 권한으로 글을 삭제했습니다.');await loadEntries()}catch(error){sayAdmin(error.message||'삭제 중 오류가 발생했습니다.')}finally{button.disabled=false}});
        $('#cancelDeletePassword').addEventListener('click',()=>{deleteDialog.close();deleteForm.reset();pendingDeleteId=''});
        deleteForm.addEventListener('submit',async e=>{e.preventDefault();if(!pendingDeleteId)return;const submitDelete=deleteForm.querySelector('button[type="submit"]'),password=new FormData(deleteForm).get('password');submitDelete.disabled=true;try{const r=await fetch(`${projectUrl}/rest/v1/rpc/delete_guestbook_entry`,{method:'POST',headers:{...publicHeaders,'Content-Type':'application/json'},body:JSON.stringify({p_id:pendingDeleteId,p_password:password})});if(!r.ok){const detail=await r.json().catch(()=>({}));throw Error(detail.message||'삭제하지 못했습니다.')}if(await r.json()!==true)throw Error('비밀번호가 맞지 않거나 삭제할 수 없는 글입니다.');deleteDialog.close();deleteForm.reset();pendingDeleteId='';say('비밀번호를 확인해 글을 삭제했습니다.');await loadEntries()}catch(error){say(error.message||'삭제 중 오류가 발생했습니다.')}finally{submitDelete.disabled=false}})
      }catch(error){list.innerHTML='<p class="empty">Supabase 연결 설정이 필요합니다.</p>';submit.textContent='관리자 설정 필요';submit.disabled=true;say(error.message==='setup'?'Supabase 프로젝트를 만든 뒤 사이트와 연결해 주세요.':error.message||'방명록을 불러오지 못했습니다.')}
    }
    function showExtra(which){const extra=$('#extras');$('#schedule').hidden=true;extra.hidden=false;$('#dayNav').hidden=true;
      if(which==='coupons'){$('#extraTitle').textContent='Tip&쿠폰';$('#extraIntro').textContent='제목을 눌러 쿠폰 내용을 펼쳐 보세요.';$('#extraCards').innerHTML='<details class="card coupon-card coupon-item"><summary>몽쥬약국 할인쿠폰</summary><div class="coupon-content"><p>쿠폰 이미지를 누르면 안내 페이지가 열립니다. 결제 전에 쿠폰을 제시하세요.</p><a href="https://cafe.naver.com/momsolleh/746296" target="_blank" rel="noopener noreferrer" aria-label="몽쥬약국 필수템 안내 페이지 열기"><img class="coupon-image" src="./체크인유럽_몽쥬약국_할인쿠폰.png" alt="몽쥬약국 할인쿠폰. 유효기간 2026년 12월 31일까지. 100유로 미만 10퍼센트, 100유로 이상 25퍼센트, 500유로 이상 30퍼센트 할인 혜택이 안내되어 있습니다."></a><a class="coupon-link" href="https://cafe.naver.com/momsolleh/746296" target="_blank" rel="noopener noreferrer">몽쥬약국 필수템 링크 열기 ↗</a></div></details><details class="card coupon-card coupon-item"><summary>보트쿠폰</summary><div class="coupon-content"><p>할인쿠폰 코드</p><span class="coupon-code">BONVOYAGE</span></div></details>'}
      else if(which==='transport'){const a=data.extras.transport||[];$('#extraTitle').textContent='구간별 이동 가이드';$('#extraIntro').textContent='엑셀 일정표의 교통수단, 소요 시간, 비용 메모를 정리했습니다.';$('#extraCards').innerHTML=a.map(x=>`<article class="card"><h3>${escapeHtml(x.route)}</h3><p><b>${escapeHtml(x.method)}</b></p><p>${escapeHtml(x.duration)}${x.cost?' · '+escapeHtml(x.cost):''}</p><p>${escapeHtml(x.tip)}</p></article>`).join('')||'<p class="empty">표시할 정보가 없습니다.</p>'}
      else{const a=data.extras.solo||[];$('#extraTitle').textContent='11월 22일 개별 코스';$('#extraIntro').textContent='경기 관람 시간에 맞춘 바르셀로나 자유 일정 후보입니다.';$('#extraCards').innerHTML=a.map(x=>`<article class="card"><h3>${escapeHtml(x.name)}</h3><p><b>${escapeHtml(x.theme)}</b></p><p>${escapeHtml(x.route)}</p><p>${escapeHtml(x.move)}</p><p>${escapeHtml(x.tip)}</p></article>`).join('')||'<p class="empty">표시할 정보가 없습니다.</p>'}}
    document.querySelectorAll('.control').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.control').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.mode==='notices')showNotices();else if(b.dataset.mode==='coupons'||b.dataset.mode==='transport'||b.dataset.mode==='solo')showExtra(b.dataset.mode);else{$('#extras').hidden=true;$('#schedule').hidden=false;$('#dayNav').hidden=false;render(b.dataset.mode);refreshHomeNotices()}}));
    refreshHomeNotices();
    fetch('./site-data.json?v=2026-11-20-schedule-v8',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{data=d;render();focusCurrentSchedule()}).catch(()=>{$('#days').innerHTML='<p class="empty">일정 데이터를 불러오지 못했습니다. index.html과 site-data.json을 같은 폴더에 두었는지 확인해 주세요.</p>'});
