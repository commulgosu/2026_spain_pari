<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f1e9">
  <meta name="description" content="2026년 11월 바르셀로나와 파리 가족 여행 일정">
  <title>Barcelona · Paris | 가족 여행 일정</title>
  <style>
    :root{--paper:#f5f1e9;--ink:#182a2a;--muted:#6e7972;--line:#d9d8cd;--orange:#d45c3e;--green:#1e6256;--card:#fffdf8;--gold:#e7bd72}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif;line-height:1.55}
    a{color:inherit}.wrap{max-width:1120px;margin:auto;padding:0 24px}.hero{padding:46px 0 26px;background:linear-gradient(135deg,#e8e5d8,#f5f1e9 65%);border-bottom:1px solid var(--line)}
    .eyebrow{color:var(--green);font-size:.76rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-family:Georgia,"Noto Serif KR",serif;font-weight:500;font-size:clamp(2.5rem,7vw,5.2rem);line-height:.98;letter-spacing:-.045em;margin:14px 0}.hero h1 span{color:var(--orange)}
    .hero p{color:var(--muted);max-width:620px;margin:18px 0}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#ffffff80;font-size:.85rem}
    .sticky{position:sticky;top:0;z-index:5;background:#f5f1e9ed;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.controls{display:flex;gap:8px;padding:12px 0;overflow:auto}.control{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 15px;font:inherit;font-size:.9rem;white-space:nowrap;cursor:pointer}.control.active{background:var(--ink);color:white;border-color:var(--ink)}
    main{padding:30px 0 70px}.section{margin:0 0 45px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:15px}.section-head h2{font:500 clamp(1.7rem,4vw,2.6rem)/1.1 Georgia,"Noto Serif KR",serif;margin:0}.section-head p{color:var(--muted);margin:6px 0 0;font-size:.9rem}
    .day-nav{display:flex;gap:8px;overflow:auto;margin:0 auto;padding-bottom:10px}.day-link{flex:none;text-decoration:none;border:1px solid var(--line);background:#ffffff80;border-radius:10px;padding:8px 12px;font-size:.85rem;white-space:nowrap}.day-link:hover{border-color:var(--green)}
    .day{margin:0 0 28px;scroll-margin-top:120px}.day-title{display:flex;align-items:baseline;gap:10px;padding:0 0 10px;border-bottom:1px solid var(--line)}.day-title strong{font:500 1.55rem Georgia,"Noto Serif KR",serif}.day-title span{color:var(--muted);font-size:.9rem}
    .timeline{display:grid;grid-template-columns:106px 1fr;gap:0 16px}.time{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--green);font-weight:750;padding:17px 0 0}.event{position:relative;border-left:1px solid var(--line);padding:14px 0 16px 19px}.event:before{content:"";position:absolute;left:-5px;top:22px;width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px var(--paper)}.event.rain:before{background:#5585a3}.event h3{font-size:1rem;line-height:1.4;margin:0 0 7px}.event h3 a{color:inherit;text-decoration:none}.event h3 a:hover,.event h3 a:focus-visible{color:var(--green);text-decoration:underline;text-underline-offset:3px}.map-arrow{display:inline-block;color:var(--green);font-size:.8em;margin-left:3px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.badge{font-size:.73rem;color:var(--green);background:#e7eee8;padding:3px 8px;border-radius:999px}.rain .badge{color:#3b647a;background:#e4edf2}.tip{margin:0;color:var(--muted);font-size:.88rem}.transport{font-size:.83rem;color:var(--ink);margin:7px 0 0}.empty{padding:24px;background:var(--card);border-radius:14px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px}.card h3{font-size:1rem;margin:0 0 6px}.card p{margin:5px 0;color:var(--muted);font-size:.88rem}.card b{color:var(--ink)}.footer{border-top:1px solid var(--line);padding:20px 0 34px;color:var(--muted);font-size:.8rem}
    .coupon-card{grid-column:1/-1}.coupon-image{display:block;width:min(100%,560px);height:auto;margin:16px auto;border-radius:10px}.coupon-link{display:inline-flex;margin-top:8px;padding:10px 14px;border-radius:999px;background:var(--green);color:white;text-decoration:none;font-size:.9rem;font-weight:700}.coupon-link:hover{background:var(--ink)}
    @media(max-width:640px){.wrap{padding:0 16px}.hero{padding-top:34px}.timeline{grid-template-columns:76px 1fr;gap:0 9px}.time{font-size:.75rem}.event{padding-left:14px}.grid{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap">
    <div class="eyebrow">Family trip · 2026</div><h1>Barcelona <span>·</span><br>Paris</h1>
    <p>11월 21일부터 29일까지, 가족과 함께 걷는 스페인과 프랑스 여행. 날짜별 일정과 비 오는 날 대안을 한곳에 모았습니다.</p>
    <div class="stats"><span class="pill">🇪🇸 바르셀로나 · 11.21–25</span><span class="pill">🇫🇷 파리 · 11.25–28</span><span class="pill">⚽ 11.22 FC Barcelona 경기</span><span class="pill">✈️ 11.29 인천 도착 · 광명 경유 귀가</span></div>
  </div></header>
  <div class="sticky"><nav class="wrap controls" aria-label="일정 보기">
    <button class="control active" data-mode="all">전체 일정</button><button class="control" data-mode="plan">기본 일정</button><button class="control" data-mode="rain">☔ 우천 대안</button><button class="control" data-mode="transport">🚇 이동 가이드</button><button class="control" data-mode="solo">🌿 11/22 개별 코스</button><button class="control" data-mode="coupons">🎟️ Tip&amp;쿠폰</button>
  </nav><nav id="dayNav" class="wrap day-nav" aria-label="날짜 이동"></nav></div>
  <main class="wrap"><section id="schedule" class="section"><div class="section-head"><div><h2>여행 일정</h2><p>상단 날짜 버튼을 눌러 해당 일정을 바로 확인하세요.</p></div></div><div id="days"></div></section>
    <section id="extras" class="section" hidden><div class="section-head"><div><h2 id="extraTitle"></h2><p id="extraIntro"></p></div></div><div id="extraCards" class="grid"></div></section>
  </main>
  <footer class="footer"><div class="wrap">개인 여행 일정 · 방문 시간, 교통편, 요금은 현지 사정에 따라 달라질 수 있습니다.</div></footer>
  <script>
    const $=s=>document.querySelector(s);let data;
    const clean=s=>s.replace(/^\[(?:★[^\]]*|☔[^\]]*|가족 공통|아내 추천|시간확정[^\]]*|일정 분리[^\]]*)\]\s*/,'').trim();
    const mapUrl=title=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(clean(title));
    function render(mode='all'){
      const visible=(d,i)=>mode==='all'||(mode==='rain'?i.rain:mode==='plan'?!i.rain:true);
      $('#dayNav').innerHTML=data.days.map(d=>`<a class="day-link" href="#d${d.date}">11/${d.date} ${d.weekday}</a>`).join('');
      $('#days').innerHTML=data.days.map(d=>{const items=d.items.filter(i=>visible(d,i));return `<article class="day" id="d${d.date}"><div class="day-title"><strong>11월 ${d.date}일</strong><span>${d.weekday}요일</span></div>${items.length?`<div class="timeline">${items.map(i=>`<div class="time">${i.time.replace(/\s*\(우천시\)/g,'')}</div><div class="event ${i.rain?'rain':''}"><h3><a href="${mapUrl(i.title)}" target="_blank" rel="noopener noreferrer" aria-label="${clean(i.title)} · Google 지도에서 열기">${clean(i.title)}<span class="map-arrow" aria-hidden="true">↗</span></a></h3><div class="badges">${i.rain?'<span class="badge">☔ 우천 대안</span>':''}${i.duration?`<span class="badge">${i.duration}</span>`:''}</div>${i.tip?`<p class="tip">${i.tip}</p>`:''}${i.move?`<p class="transport">↗ ${i.move}</p>`:''}</div>`).join('')}</div>`:'<p class="empty">이 날짜에는 표시할 일정이 없습니다.</p>'}</article>`}).join('');
    }
    function showExtra(which){const extra=$('#extras');$('#schedule').hidden=true;extra.hidden=false;$('#dayNav').hidden=true;
      if(which==='coupons'){$('#extraTitle').textContent='Tip&쿠폰';$('#extraIntro').textContent='여행 중 사용할 할인 쿠폰과 참고 정보를 모았습니다.';$('#extraCards').innerHTML='<article class="card coupon-card"><h3>몽쥬약국 할인쿠폰</h3><p>쿠폰 이미지를 누르면 안내 페이지가 열립니다. 결제 전에 쿠폰을 제시하세요.</p><a href="https://cafe.naver.com/momsolleh/746296" target="_blank" rel="noopener noreferrer" aria-label="몽쥬약국 필수템 안내 페이지 열기"><img class="coupon-image" src="./체크인유럽_몽쥬약국_할인쿠폰.png" alt="몽쥬약국 할인쿠폰. 유효기간 2026년 12월 31일까지. 100유로 미만 10퍼센트, 100유로 이상 25퍼센트, 500유로 이상 30퍼센트 할인 혜택이 안내되어 있습니다."></a><a class="coupon-link" href="https://cafe.naver.com/momsolleh/746296" target="_blank" rel="noopener noreferrer">몽쥬약국 필수템 링크 열기 ↗</a></article>'}
      else if(which==='transport'){const a=data.extras.transport||[];$('#extraTitle').textContent='구간별 이동 가이드';$('#extraIntro').textContent='엑셀 일정표의 교통수단, 소요 시간, 비용 메모를 정리했습니다.';$('#extraCards').innerHTML=a.map(x=>`<article class="card"><h3>${x.route}</h3><p><b>${x.method}</b></p><p>${x.duration}${x.cost?' · '+x.cost:''}</p><p>${x.tip}</p></article>`).join('')||'<p class="empty">표시할 정보가 없습니다.</p>'}
      else{const a=data.extras.solo||[];$('#extraTitle').textContent='11월 22일 개별 코스';$('#extraIntro').textContent='경기 관람 시간에 맞춘 바르셀로나 자유 일정 후보입니다.';$('#extraCards').innerHTML=a.map(x=>`<article class="card"><h3>${x.name}</h3><p><b>${x.theme}</b></p><p>${x.route}</p><p>${x.move}</p><p>${x.tip}</p></article>`).join('')||'<p class="empty">표시할 정보가 없습니다.</p>'}}
    document.querySelectorAll('.control').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.control').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.mode==='coupons'||b.dataset.mode==='transport'||b.dataset.mode==='solo')showExtra(b.dataset.mode);else{$('#extras').hidden=true;$('#schedule').hidden=false;$('#dayNav').hidden=false;render(b.dataset.mode)}}));
    fetch('./site-data.json?v=2026-11-18-coupons-tips',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{data=d;render()}).catch(()=>{$('#days').innerHTML='<p class="empty">일정 데이터를 불러오지 못했습니다. index.html과 site-data.json을 같은 폴더에 두었는지 확인해 주세요.</p>'});
  </script>
</body>
</html>
